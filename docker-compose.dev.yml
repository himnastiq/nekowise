# ============================================
# Nekowise — Docker Compose (Development)
# ============================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Overrides the production compose with:
#   - Hot-reload via volume mounts
#   - Dev servers (nodemon + vite)
#   - Full devDependencies installed
#   - Node.js debug port exposed
# ============================================

services:
  # ── Server (Dev: nodemon with hot reload) ───
  server:
    build:
      context: ./server
      target: dev
    container_name: nekowise-server-dev
    env_file: .env.docker
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/nekowise
      - CLIENT_URL=http://localhost:5173
      - PORT=5000
    volumes:
      - ./server/src:/app/src:delegated
    ports:
      - "5000:5000"
      - "9229:9229"

  # ── Client (Dev: Vite dev server with HMR) ──
  client:
    build:
      context: ./client
      target: dev
    container_name: nekowise-client-dev
    environment:
      - VITE_API_URL=/api
      - VITE_WS_URL=
      - VITE_PROXY_API_TARGET=http://server:5000
      - VITE_PROXY_WS_TARGET=ws://server:5000
    volumes:
      - ./client/src:/app/src:delegated
      - ./client/public:/app/public:delegated
    ports:
      - "5173:5173"
