# ============================================
# Nekowise — Docker Compose (Production-like)
# ============================================
# Usage:
#   docker compose up -d          # Start all services
#   docker compose down -v        # Stop & remove volumes
#   docker compose logs -f        # Follow logs
#   docker compose ps             # Check service status
# ============================================

services:
  # ── MongoDB ─────────────────────────────────
  mongo:
    image: mongo:7
    container_name: nekowise-mongo
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nekowise-net
    restart: unless-stopped

  # ── Server (Express API + WebSocket) ────────
  server:
    build:
      context: ./server
      target: production
    container_name: nekowise-server
    env_file: .env.docker
    environment:
      - MONGODB_URI=mongodb://mongo:27017/nekowise
      - CLIENT_URL=http://localhost
      - PORT=5000
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - nekowise-net
    restart: unless-stopped

  # ── Client (Nginx + React SPA) ──────────────
  client:
    build:
      context: ./client
      target: production
      args:
        VITE_API_URL: /api
        VITE_WS_URL: ""
    container_name: nekowise-client
    depends_on:
      - server
    ports:
      - "80:80"
    networks:
      - nekowise-net
    restart: unless-stopped

networks:
  nekowise-net:
    driver: bridge

volumes:
  mongo-data:
    driver: local
