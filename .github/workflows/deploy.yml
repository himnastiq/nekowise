name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production, staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # never cancel a running deploy

jobs:
  # ─────────────────────────────────────────────
  # Guard: CI must pass before anything deploys
  # ─────────────────────────────────────────────
  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Re-run the build one more time so the deploy workflow is
      # self-contained. Alternatively, use `needs` + workflow_run trigger.
      - name: Verify client build passes
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

  # ─────────────────────────────────────────────
  # DOCKER — Build & Push Images to GHCR
  # ─────────────────────────────────────────────
  docker-publish:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [ci-gate]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Server Image ──
      - name: Docker meta (server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=sha
            type=raw,value=latest
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & Push Server Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          target: production
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Client Image ──
      - name: Docker meta (client)
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/client
          tags: |
            type=sha
            type=raw,value=latest
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & Push Client Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          target: production
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_WS_URL=${{ secrets.VITE_WS_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # CLIENT → Vercel (Static Hosting)
  # ─────────────────────────────────────────────
  deploy-client:
    name: Deploy Client → Vercel
    runs-on: ubuntu-latest
    needs: [docker-publish]
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        working-directory: client
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        working-directory: client
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Comment deploy URL on commit
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            if (url) {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: `✅ Client deployed to Vercel: ${url}`,
              });
            }

  # ─────────────────────────────────────────────
  # SERVER → Render (Docker Web Service)
  # ─────────────────────────────────────────────
  # Prerequisites:
  #   1. Create a Web Service on Render (https://dashboard.render.com)
  #      - Connect your GitHub repo
  #      - Set Dockerfile path: ./server/Dockerfile
  #      - Set Docker context: ./server
  #   2. Create a Deploy Hook in Render dashboard → Settings → Deploy Hook
  #   3. Add the hook URL as RENDER_DEPLOY_HOOK_URL secret in GitHub
  #   4. Set environment variables in Render dashboard:
  #      - MONGODB_URI (your MongoDB Atlas connection string)
  #      - All other env vars from .env.example
  # ─────────────────────────────────────────────
  deploy-server:
    name: Deploy Server → Render
    runs-on: ubuntu-latest
    needs: [docker-publish]
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret not set — skipping Render deploy"
            echo "Set up a Deploy Hook in Render dashboard and add it as a GitHub secret"
            exit 0
          fi

          echo "🚀 Triggering Render deployment..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Render deploy hook response: HTTP $STATUS"

          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "::warning::Render deploy hook returned HTTP $STATUS"
          fi

  # ─────────────────────────────────────────────
  # POST-DEPLOY — smoke test
  # ─────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-client, deploy-server]
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Health-check API
        run: |
          API_URL="${{ secrets.VITE_API_URL }}"
          if [ -z "$API_URL" ]; then
            echo "::warning::VITE_API_URL not set — skipping API health check"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}/health" || echo "000")
          echo "API health status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            echo "::warning::API health check returned $STATUS — verify the server is up"
          fi

      - name: Health-check client
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://nekowise.vercel.app" || echo "000")
          echo "Client status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            echo "::warning::Client returned $STATUS"
          fi
