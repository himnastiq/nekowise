name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # DOCKER — Validate container builds on PR
  # ─────────────────────────────────────────────
  docker-validate:
    name: Validate Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image (validate only)
        uses: docker/build-push-action@v6
        with:
          context: ./server
          target: production
          push: false
          cache-from: type=gha

      - name: Build client image (validate only)
        uses: docker/build-push-action@v6
        with:
          context: ./client
          target: production
          push: false
          build-args: VITE_API_URL=/api
          cache-from: type=gha

  # ─────────────────────────────────────────────
  # PREVIEW — Vercel auto-deploys PR previews (no manual job needed)
  # ─────────────────────────────────────────────
