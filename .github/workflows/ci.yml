name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # SERVER — lint & test
  # ─────────────────────────────────────────────
  server:
    name: Server (Node.js)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Lint
        working-directory: server
        run: npm run lint --if-present

      - name: Run tests
        working-directory: server
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/neko_test
          JWT_SECRET: ci-test-secret-do-not-use-in-prod
          PORT: 5000
        run: npm test --if-present

  # ─────────────────────────────────────────────
  # CLIENT — lint, test & build
  # ─────────────────────────────────────────────
  client:
    name: Client (React / Vite)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint --if-present

      - name: Run tests
        working-directory: client
        run: npm test --if-present -- --run

      - name: Build
        working-directory: client
        env:
          VITE_API_URL: https://api.example.com
          VITE_WS_URL: wss://api.example.com/ws
        run: npm run build

      - name: Upload build artifact
        # Only upload on the latest Node version to save storage
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: client-dist-${{ github.sha }}
          path: client/dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  # SECURITY — audit both workspaces
  # ─────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Audit server dependencies
        working-directory: server
        # Allow high-severity advisories to not block CI — change to --audit-level=high to enforce
        run: npm audit --audit-level=critical --if-present || true

      - name: Audit client dependencies
        working-directory: client
        run: npm audit --audit-level=critical --if-present || true

  # ─────────────────────────────────────────────
  # DOCKER — build & integration test
  # ─────────────────────────────────────────────
  docker:
    name: Docker Build & Integration Test
    runs-on: ubuntu-latest
    needs: [server, client]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env.docker for compose
        run: |
          cat > .env.docker << 'EOF'
          NODE_ENV=production
          PORT=5000
          MONGODB_URI=mongodb://mongo:27017/nekowise
          JWT_SECRET=ci-integration-test-secret-minimum-32-chars!!
          JWT_REFRESH_SECRET=ci-integration-refresh-secret-min-32-chars!!
          JWT_EXPIRE=7d
          JWT_REFRESH_EXPIRE=30d
          CLIENT_URL=http://localhost
          LOG_LEVEL=info
          EOF

      - name: Build all Docker images
        run: docker compose build

      - name: Start full stack
        run: |
          docker compose up -d
          echo "⏳ Waiting for services to stabilize..."

      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 15); do
            if docker compose exec -T mongo mongosh --eval "db.runCommand({ping:1})" > /dev/null 2>&1; then
              echo "✅ MongoDB is ready"
              break
            fi
            echo "  Attempt $i/15 — waiting for MongoDB..."
            sleep 3
          done

      - name: Wait for server
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Server is healthy"
              curl -s http://localhost:5000/api/health | head -1
              break
            fi
            echo "  Attempt $i/20 — server returned $STATUS"
            sleep 5
          done
          [ "$STATUS" = "200" ] || (echo "❌ Server failed to start" && exit 1)

      - name: Health check — Client (Nginx)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80)
          echo "Client HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || [ "$STATUS" = "304" ]

      - name: Health check — API via Nginx proxy
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/api/health)
          echo "API via Nginx proxy status: $STATUS"
          [ "$STATUS" = "200" ]

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
